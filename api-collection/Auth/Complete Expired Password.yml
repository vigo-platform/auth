info:
  name: Complete Expired Password
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/password/expired/complete"
  body:
    type: json
    data: |-
      {
        "passwordChangeToken": "{{expiredPasswordChangeToken}}",
        "newPassword": "{{newPassword}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
