info:
  name: Complete Password Change
  type: http
  seq: 17

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/password/change/complete"
  auth:
    type: bearer
    token: "{{accessToken}}"
  body:
    type: json
    data: |-
      {
        "passwordChangeToken": "{{passwordChangeToken}}",
        "newPassword": "{{newPassword}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
