info:
  name: Complete Password Reset
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/password/reset/complete"
  body:
    type: json
    data: |-
      {
        "passwordResetToken": "{{passwordResetToken}}",
        "newPassword": "{{newPassword}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
