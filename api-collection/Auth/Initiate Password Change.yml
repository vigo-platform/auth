info:
  name: Initiate Password Change
  type: http
  seq: 15

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/password/change/initiate"
  auth:
    type: bearer
    token: "{{accessToken}}"
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{currentPassword}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
