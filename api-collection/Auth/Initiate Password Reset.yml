info:
  name: Initiate Password Reset
  type: http
  seq: 18

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/password/reset/initiate"
  body:
    type: json
    data: |-
      {
        "identifier": "{{passwordResetIdentifier}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
