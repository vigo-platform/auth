info:
  name: Registration Complete
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register/complete"
  body:
    type: json
    data: |-
      {
        "registrationToken": "{{registrationToken}}",
        "password": "example-password",
        "firstName": "Test",
        "lastName": "User"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
