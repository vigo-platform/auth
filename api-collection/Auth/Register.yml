info:
  name: Register
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "new@example.com",
        "password": "example-password",
        "firstName": "Test",
        "lastName": "User"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
