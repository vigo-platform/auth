info:
  name: Registration Verify
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register/verify"
  body:
    type: json
    data: |-
      {
        "mfaToken": "{{registrationMfaToken}}",
        "otp": "{{registrationOtp}}"
      }

runtime:
  variables:
    - name: registrationMfaToken
      value: e7Lqqnsp0dxNv66fueuylR9yufkgBbiN89iKh94JiyY
    - name: registrationOtp
      value: "368943"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
