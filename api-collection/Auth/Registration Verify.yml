info:
  name: Registration Verify
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register/verify"
  body:
    type: json
    data: |-
      {
        "mfaToken": "{{registrationMfaToken}}",
        "otp": "{{registrationOtp}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
