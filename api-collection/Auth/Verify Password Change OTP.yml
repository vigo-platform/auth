info:
  name: Verify Password Change OTP
  type: http
  seq: 16

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/password/change/verify"
  auth:
    type: bearer
    token: "{{accessToken}}"
  body:
    type: json
    data: |-
      {
        "mfaToken": "{{passwordChangeMfaToken}}",
        "otp": "{{passwordChangeOtp}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
