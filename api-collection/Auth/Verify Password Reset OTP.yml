info:
  name: Verify Password Reset OTP
  type: http
  seq: 19

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/password/reset/verify"
  body:
    type: json
    data: |-
      {
        "mfaToken": "{{passwordResetMfaToken}}",
        "otp": "{{passwordResetOtp}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
