spring:
  application:
    name: auth

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  public-paths:
    - "/.well-known/jwks.json"
    - "/actuator/**"
    - "/error"
    - "/favicon.ico"

  user-grpc:
    host: ${USER_GRPC_HOST}
    port: ${USER_GRPC_PORT}
    timeout-ms: ${USER_GRPC_TIMEOUT_MS:3000}

jwt:
  key-id: ${JWT_KEY_ID:vigo-auth-key-1}
  private-key-path: ${JWT_PRIVATE_KEY_PATH:.keys/private_key.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:.keys/public_key.pem}

management:
  endpoints:
    web:
      exposure:
        include:
          - prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false

logging:
  pattern:
    correlation: "%correlationId"
